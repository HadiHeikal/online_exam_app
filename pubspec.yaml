name: online_exam_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking
  dio: ^5.11.0
  retrofit: ^4.9.0
  json_annotation: ^4.12.0

  # Dependency Injection
  get_it: ^9.2.1
